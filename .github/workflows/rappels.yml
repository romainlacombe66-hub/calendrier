name: Rappels

on:
  schedule:
    # Toutes les 15 minutes (heure UTC). Le programme ne notifie pas entre 22 h et 7 h (heure de Paris).
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # bouton « Run workflow » pour lancer un envoi à la main

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Envoyer les rappels dus
        run: node scripts/send-reminders.mjs
        env:
          TZ: Europe/Paris
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
